[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-doc-benchmark"
version = "2.0.0"
description = "Controlled documentation-influence experiments over fictional and real documentation"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy==2.0.52"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
