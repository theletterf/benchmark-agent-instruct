[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-doc-benchmark"
version = "0.1.0"
description = "A reproducible benchmark of instruction salience in fictional fables"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
